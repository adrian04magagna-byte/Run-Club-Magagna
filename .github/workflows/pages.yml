name: Publicar app web no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Exigir URL da API (variável do repositório, não é segredo)
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then echo "Defina a variável API_BASE_URL em Settings > Secrets and variables > Actions > Variables"; exit 1; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Gerar o app web estático
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npx expo export --platform web
      - name: Preparar para o GitHub Pages
        run: |
          cp dist/index.html dist/404.html   # Pages não tem fallback de SPA; rotas como /workout/123 caem aqui
          touch dist/.nojekyll               # a pasta _expo começa com "_" e o Jekyll a ignoraria
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
